<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>溫習樂園</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="溫習樂園">
<meta name="theme-color" content="#ffd36b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<!-- 版本號：上載前一定要改（WEB-07） -->
<script>window.__SR_VER='2026.11.18-1';</script>
<style>
:root{
  --ink:#3a2a5c; --ink2:#6b5a8a; --card:#ffffff; --line:#eadff7;
  --pri:#ff7a45; --pri-d:#d9541f; --pur:#7b5cff; --pur-d:#5a3fd6;
  --ok:#22b573; --ok-d:#168a55; --bad:#ff4f6d; --bad-d:#c92f4b;
  --gold:#ffb703; --app-h:100vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:#fff4d6}
body{font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;color:var(--ink);font-size:18px;
  background:linear-gradient(180deg,#fff4d6 0%,#ffe3ef 55%,#e6e0ff 100%)}
#app{height:var(--app-h);display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px)}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:18px;font-size:20px;font-weight:800;
  background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn.pur{background:var(--pur);box-shadow:0 5px 0 var(--pur-d)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.gray{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8cce8}
.btn:disabled{background:#d7d0e2;box-shadow:0 5px 0 #b9b0c7;color:#fff}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 #eadcf5,0 8px 24px rgba(90,60,150,.08);margin-bottom:14px}
h1,h2,h3{margin:0 0 8px}
.muted{color:var(--ink2)}
.center{text-align:center}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:17px;box-shadow:0 3px 0 #eadcf5}
.back{background:#fff;border-radius:14px;width:44px;height:44px;font-size:22px;box-shadow:0 3px 0 #eadcf5;flex:none}
.ttl{flex:1;font-size:22px;font-weight:900}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:14px;font-weight:900;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid #fff}

/* 寵物 */
.stage{position:relative;border-radius:26px;padding:16px 14px 14px;margin-bottom:14px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.bg-rainbow{background:linear-gradient(180deg,#bfe9ff 0%,#e8f7ff 55%,#b9f0b0 56%,#8fdc85 100%)}
.bg-sea{background:linear-gradient(180deg,#4fc3f7 0%,#1e88e5 60%,#f3d98b 61%,#e5c66d 100%)}
.bg-space{background:radial-gradient(circle at 30% 20%,#6b4fd8 0%,#2a1a63 55%,#140b33 100%)}
.bg-candy{background:linear-gradient(180deg,#ffd1ec 0%,#ffe9f6 55%,#ffc2df 56%,#ff9fcf 100%)}
.bg-forest{background:linear-gradient(180deg,#d4f5c9 0%,#eefbe8 50%,#7cc576 51%,#4f9d4a 100%)}
.bg-space .pname,.bg-sea .pname{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.petwrap{display:flex;flex-direction:column;align-items:center}
.pet{position:relative;width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pet .pb{font-size:calc(var(--s)*.78);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.pet .acc{position:absolute;line-height:1;pointer-events:none}
.pet .hat{top:calc(var(--s)*-.12);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.4)}
.pet .glass{top:calc(var(--s)*.3);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.32)}
.pet .held{bottom:0;right:calc(var(--s)*-.08);font-size:calc(var(--s)*.34)}
.egg .pb{animation:wob 2.2s infinite}
@keyframes wob{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-9deg)}80%{transform:rotate(8deg)}85%{transform:rotate(-6deg)}90%{transform:rotate(4deg)}}
.bounce{animation:bnc .5s}
@keyframes bnc{0%{transform:scale(1)}30%{transform:scale(1.18,.86)}60%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
.bubble{background:#fff;border-radius:18px;padding:10px 14px;font-size:17px;font-weight:700;position:relative;margin-bottom:10px;max-width:92%;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bubble:after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.pname{font-size:20px;font-weight:900;margin-top:4px}
.xpbar{height:16px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;width:80%;margin-top:6px;border:2px solid #fff}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffcf3f,#ff8a3d);border-radius:999px;transition:width .6s}
.lvtag{font-size:14px;font-weight:900;background:var(--pur);color:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}

/* 主頁格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:#fff;border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #e2d5f2}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #e2d5f2}
.tile .ic{font-size:36px;line-height:1.1}
.tile small{font-weight:700;color:var(--ink2);font-size:13px}
.bigmap{font-size:24px;padding:18px;margin-bottom:14px}
.foot{text-align:center;font-size:13px;color:var(--ink2);margin-top:18px;line-height:1.8}
.foot button{background:none;font-size:14px;color:var(--ink2);text-decoration:underline;padding:6px}

/* 地圖 */
.isle{display:flex;align-items:center;gap:12px;border-radius:22px;padding:14px;margin-bottom:12px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15);position:relative;width:100%;text-align:left}
.isle:active{transform:translateY(4px)}
.isle .ic{font-size:44px;background:rgba(255,255,255,.25);border-radius:18px;width:66px;height:66px;display:flex;align-items:center;justify-content:center;flex:none}
.isle .nm{font-size:21px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.isle .ds{font-size:14px;opacity:.95;font-weight:700}
.isle .pg{height:10px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:6px;overflow:hidden}
.isle .pg i{display:block;height:100%;background:#fff;border-radius:9px}
.weak{position:absolute;top:-8px;right:10px;background:#fff;color:var(--bad-d);font-size:13px;font-weight:900;border-radius:999px;padding:3px 10px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.node{width:78px;height:78px;border-radius:50%;font-size:28px;font-weight:900;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.node:active{transform:translateY(4px)}
.node.lock{background:#cfc6dc!important;box-shadow:0 6px 0 #ada3bd}
.node .st{position:absolute;bottom:-24px;font-size:16px;letter-spacing:-2px;white-space:nowrap}
.nodewrap{height:108px;display:flex;align-items:flex-start}
.nodewrap.cur .node{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 答題 */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:18px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 #eadcf5}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7ee08a,#22b573);border-radius:999px;transition:width .4s}
.combo{font-weight:900;color:var(--pri-d);min-width:56px;text-align:right}
.combo.hot{animation:bnc .4s}
.qcard{background:#fff;border-radius:24px;padding:18px 16px;box-shadow:0 5px 0 #e2d5f2;margin-bottom:14px}
.qtip{font-size:15px;font-weight:800;color:var(--pur-d);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.qtip .spk{margin-left:auto;background:#f1ecff;border-radius:12px;padding:4px 10px;font-size:18px}
.qtext{font-size:23px;line-height:1.75;font-weight:700;letter-spacing:.5px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--pur);text-align:center;color:var(--pur-d);padding:0 4px;margin:0 2px}
.blank.fill-ok{color:var(--ok-d);border-color:var(--ok)}
.blank.fill-bad{color:var(--bad-d);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.long{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.three .opt{justify-content:center;flex-direction:column;gap:6px;font-size:20px;padding:14px 4px}
.opt{background:#fff;border-radius:18px;padding:16px 10px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #e2d5f2;display:flex;align-items:center;gap:10px;text-align:left;line-height:1.45}
.opts.long .opt{font-size:19px;padding:14px}
.opt b{flex:none;width:32px;height:32px;border-radius:10px;background:#f1ecff;color:var(--pur-d);display:flex;align-items:center;justify-content:center;font-size:17px}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #e2d5f2}
.opt.right{background:#dff7ea;box-shadow:0 5px 0 #9fdcbc}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{background:#ffe1e6;box-shadow:0 5px 0 #f3a7b5}
.opt.wrong b{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hint{background:#fff8e1;border-radius:14px;padding:10px 12px;font-size:19px;font-weight:700;margin-top:10px;line-height:1.6}
.ansline{min-height:70px;background:#f7f3ff;border:3px dashed #cbbcf2;border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ansline.col,.pool.col{flex-direction:column;align-items:stretch}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px;min-height:56px}
.tl{background:#fff;border-radius:14px;padding:10px 14px;font-size:21px;font-weight:800;box-shadow:0 4px 0 #d9cbef;line-height:1.4;text-align:left}
.tl:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cbef}
.ansline .tl{background:var(--pur);color:#fff;box-shadow:0 4px 0 var(--pur-d)}
.tl.lab b{color:var(--pur-d);margin-right:6px}
.ansline .tl.lab b{color:#ffe082}
.endp{font-size:24px;font-weight:900;color:var(--ink2)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;border-radius:12px;background:#f1ecff;border:3px dashed #b9a6f5;font-size:24px;font-weight:900;vertical-align:middle;margin:2px 3px;padding:0 4px;color:var(--pur-d)}
.slot.sel{border-style:solid;border-color:var(--pri);background:#fff1e8}
.slot.okk{background:#dff7ea;border:3px solid var(--ok);color:var(--ok-d)}
.slot.bad{background:#ffe1e6;border:3px solid var(--bad);color:var(--bad-d)}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.pal{background:#fff;border-radius:14px;height:56px;font-size:26px;font-weight:900;box-shadow:0 4px 0 #d9cbef}
.pal.sm{font-size:16px;letter-spacing:-2px}
.pal:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cbef}
.chs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ch{width:50px;height:60px;border-radius:12px;background:#f7f3ff;font-size:32px;font-weight:800;box-shadow:0 3px 0 #ddd0f3}
.ch.pun{background:none;box-shadow:none;width:auto;min-width:18px;cursor:default}
.ch.found{background:#ffe9a8;box-shadow:0 3px 0 #e8c25b;animation:bnc .4s}
.ch.miss{background:#ffe1e6}
.ch.okk{background:#dff7ea;box-shadow:0 3px 0 #9fdcbc}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{background:#fff;border-radius:16px;padding:16px 6px;font-size:23px;font-weight:800;box-shadow:0 4px 0 #d9cbef}
.mt.sel{background:#fff1e8;box-shadow:0 4px 0 #f2b38f;outline:3px solid var(--pri)}
.mt.done{background:#dff7ea;box-shadow:0 4px 0 #9fdcbc;color:var(--ok-d);pointer-events:none;opacity:.8}
.foe{display:flex;align-items:center;gap:12px;background:#2d1b5e;color:#fff;border-radius:20px;padding:10px 14px;margin-bottom:12px}
.foe .fe{font-size:46px;line-height:1}
.foe .hp{flex:1}
.foe .hpbar{height:14px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-top:4px}
.foe .hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb86b);transition:width .4s}
.hitfx{animation:hitfx .5s}
@keyframes hitfx{0%{transform:scale(1)}20%{transform:scale(.8) rotate(-10deg);filter:brightness(3)}100%{transform:scale(1)}}

/* 回應 */
#fb{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);border-radius:26px 26px 0 0;transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:30;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
#fb.show{transform:translateY(0);visibility:visible}
#fb.good{background:#dff7ea}
#fb.bad{background:#ffe8ec}
#fb .fh{font-size:24px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:8px}
#fb.good .fh{color:var(--ok-d)}
#fb.bad .fh{color:var(--bad-d)}
#fb .fa{font-size:20px;font-weight:800;margin-bottom:6px;line-height:1.6}
#fb .fe{font-size:17px;line-height:1.6;margin-bottom:12px;color:var(--ink)}
#fb .fx{font-size:16px;font-weight:800;margin-bottom:10px}
.float{position:fixed;font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #b07800;pointer-events:none;z-index:50;animation:flt 1s forwards}
@keyframes flt{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);visibility:hidden;background:#3a2a5c;color:#fff;border-radius:18px;padding:12px 18px;font-weight:800;z-index:60;transition:transform .3s,visibility .3s;max-width:90%;text-align:center;font-size:17px}
#toast.show{transform:translate(-50%,0);visibility:visible}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hand{position:absolute;font-size:44px;pointer-events:none;z-index:20;animation:hand 1.1s infinite}
@keyframes hand{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* 結果 */
.bigstars{font-size:58px;letter-spacing:6px;text-align:center;margin:6px 0}
.bigstars span{display:inline-block;opacity:.25;filter:grayscale(1)}
.bigstars span.on{opacity:1;filter:none;animation:pop .5s backwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.grade{font-size:84px;font-weight:900;color:var(--bad-d);text-align:center;line-height:1.1;font-family:"Kaiti TC","STKaiti",serif}
.stat{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:2px dashed var(--line);font-weight:700}
.stat:last-child{border:0}
.evo{font-size:22px;font-weight:900;text-align:center;color:var(--pur-d);margin:8px 0}

/* 怪獸 */
.mons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mon{background:#2d1b5e;color:#fff;border-radius:18px;padding:10px 4px;text-align:center;position:relative}
.mon .me{font-size:40px;line-height:1.2}
.mon .mh{font-size:13px;letter-spacing:-1px}
.mon .ms{font-size:12px;opacity:.85}
.mon.tired{opacity:.55}
.zzz{position:absolute;top:4px;right:6px;font-size:14px}

/* 任務 */
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.task:last-child{border:0}
.task .ti{font-size:32px}
.task .tx{flex:1;font-weight:800}
.task .tb{height:10px;background:#f1ecff;border-radius:9px;overflow:hidden;margin-top:6px}
.task .tb i{display:block;height:100%;background:var(--pur);border-radius:9px}
.claim{background:var(--gold);color:#5a3a00;border-radius:14px;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 #c98f00;font-size:16px}
.claim:disabled{background:#eee;color:#aaa;box-shadow:0 4px 0 #ccc}
.chest{font-size:70px;text-align:center;display:block;margin:0 auto}
.chest.ready{animation:wob 1.4s infinite}

/* 商店 */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;white-space:nowrap;box-shadow:0 3px 0 #e2d5f2;font-size:16px}
.tab.on{background:var(--pur);color:#fff;box-shadow:0 3px 0 var(--pur-d)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 4px 0 #e2d5f2;font-weight:800;font-size:15px}
.item .ie{font-size:40px;line-height:1.3}
.item.eq{outline:3px solid var(--ok)}
.item .pr{font-size:14px;color:var(--pri-d)}
.item .bgsw{height:40px;border-radius:12px;margin:4px 8px}

/* 成就 */
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ach{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 0 #e2d5f2}
.ach .ae{font-size:40px}
.ach.off .ae{filter:grayscale(1);opacity:.35}
.ach .an{font-weight:900}
.ach .ad{font-size:13px;color:var(--ink2)}

/* 家長 */
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:16px;font-weight:700}
.bar .bl{width:124px;flex:none;font-size:15px;white-space:nowrap}
.bar .bt{flex:1;height:16px;background:#f1ecff;border-radius:9px;overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:9px}
.bar .bv{width:64px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.week{display:flex;align-items:flex-end;gap:6px;height:110px;margin:8px 0 4px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;font-weight:700}
.week div i{display:block;width:70%;background:var(--pur);border-radius:6px 6px 0 0;min-height:2px}
.fld{display:block;margin-bottom:10px;font-weight:800;font-size:16px}
.fld input,.fld textarea,.fld select{display:block;width:100%;margin-top:4px;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);font-family:inherit;color:var(--ink);background:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:800;border-bottom:2px dashed var(--line)}
.sw:last-child{border:0}
.tog{width:58px;height:34px;border-radius:999px;background:#d7d0e2;position:relative;transition:background .2s;flex:none}
.tog:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--ok)}
.tog.on:after{left:28px}

  for(let i = QS.length-1; i >= 0; i--) if(QS[i].sk === 'custom'){ delete QMAP[QS[i].id]; QS.splice(i, 1); }
  (S.custom||[]).forEach(c => { const q = {t:'mc', q:c.q, o:c.o, a:c.a, e:c.e, id:c.id, sk:'custom'}; QS.push(q); QMAP[q.id] = q; });
}

function levelsOf(sk){
  const qs = skillQs(sk), n = LV_SIZE(sk), out = [];
  for(let i = 0; i < qs.length; i += n) out.push(qs.slice(i, i+n));
  if(out.length > 1 && out[out.length-1].length < n/2){ const last = out.pop(); out[out.length-1] = out[out.length-1].concat(last); }
  return out;
}

/* ========== 聲音（WEB-01、WEB-24） ========== */
let AC = null, acStale = false;
function ensureAudio(){
  if(!S.set.sfx) return;
  try{
    if(AC && (acStale || AC.state === 'closed' || AC.state === 'interrupted')){ try{ AC.close(); }catch(e){} AC = null; }
    if(!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); AC.onstatechange = () => { if(AC && AC.state !== 'running') acStale = true; }; }
    acStale = false;
    if(AC.state === 'suspended') AC.resume();
  }catch(e){}
}
function tone(f, d, type, vol, delay){
  if(!S.set.sfx || !AC) return;
  try{
    const t = AC.currentTime + (delay||0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  }catch(e){}
}
const SFX = {
  tap(){ tone(560, .06, 'sine', .07); },
  ok(){ tone(660, .12, 'triangle', .16); tone(990, .2, 'triangle', .16, .1); },
  bad(){ tone(240, .18, 'sawtooth', .07); tone(180, .25, 'sawtooth', .07, .12); },
  coin(){ tone(1320, .07, 'square', .05); tone(1760, .14, 'square', .05, .07); },
  up(){ [523,659,784,1047].forEach((f,i) => tone(f, .2, 'triangle', .15, i*.11)); },
  hit(){ tone(140, .16, 'square', .1); tone(90, .2, 'square', .08, .06); },
  win(){ [523,659,784,659,784,1047].forEach((f,i) => tone(f, .18, 'triangle', .14, i*.12)); }
};
let speakOK = false;
function speak(text){
  if(!S.set.tts || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-HK'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]HK|yue/i.test(v.lang)); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function unlockSpeech(){ if(speakOK || !('speechSynthesis' in window)) return; speakOK = true; try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){} }
window.addEventListener('pointerdown', () => { ensureAudio(); unlockSpeech(); }, true);

function skillAcc(sk){ let c = 0, n = 0; skillQs(sk).forEach(q => { const s = S.qs[q.id]; if(s){ c += s.c; n += s.c + s.w; } }); return n ? {c, n, p: c/n} : {c:0, n:0, p:null}; }
function recentAcc(sk){ const a = S.sk[sk] || []; return a.length ? a.reduce((x,y) => x+y, 0) / a.length : null; }
function weakest(){
  let best = null, bp = 2;
  activeSkills().forEach(s => { if(s.id === 'custom' || s.id === 'match') return; const a = S.sk[s.id] || []; if(a.length < 5) return; const p = recentAcc(s.id); if(p < bp){ bp = p; best = s.id; } });
  return (best && bp < 0.85) ? best : (best || 'qtype');   // 未有足夠資料：預設「問號洞穴」（之前工作紙最弱）
}
function streak(){
  let d = today(), n = 0;
  if(!(S.days[d] && S.days[d].n)) d = addDays(d, -1);
  while(S.days[d] && S.days[d].n){ n++; d = addDays(d, -1); }
  return n;
}
function totalStars(){ return Object.values(S.lv).reduce((a, b) => a + b, 0); }

};
function ensureTasks(){
  const d = today();
  if(S.tasks && S.tasks.d === d) return;
  const w = weakest();
  S.tasks = {d, w, chest:false, list:[
    {id:'correct', goal:15, p:0, got:false},
    {id:'weak', goal:5, p:0, got:false},
    {id:'lv', goal:1, p:0, got:false},
    monCount() ? {id:'monster', goal:2, p:0, got:false} : {id:'combo', goal:5, p:0, got:false}
  ]};
  save();
}
function taskAdd(id, n, setMax){
  ensureTasks();
  const t = S.tasks.list.find(x => x.id === id); if(!t) return;
  const before = t.p >= t.goal;
  t.p = setMax ? Math.max(t.p, n) : t.p + n;
  if(!before && t.p >= t.goal) setTimeout(() => toast(`🎯 每日任務完成：${TASK_TXT[id](t)[1]}！去領獎勵啦`), 400);
}
const tasksToClaim = () => { ensureTasks(); return S.tasks.list.filter(t => t.p >= t.goal && !t.got).length + (S.tasks.list.every(t => t.got) && !S.tasks.chest ? 1 : 0); };

SCREENS.ach = () => topbar('🏆 成就', coinChip()) + `<div class="achs">${ACH.map(a => `<div class="ach ${S.ach[a.id] ? '' : 'off'}"><div class="ae">${a.e}</div><div class="an">${a.n}</div><div class="ad">${a.d}</div></div>`).join('')}</div>`;

/* ========== 答題 ========== */
let R = null;
function startSession(mode, list, meta){
  if(!list.length){ toast('冇題目'); return; }
  R = {mode, list, i:0, ok:0, combo:0, maxCombo:0, coins:0, xp:0, meta:meta||{}, newMon:0, hits:0, kills:0, ans:false, results:[]};
  show('quiz');
}
function sessionTitle(){
  if(R.mode === 'level') return `${SK[R.meta.sk].icon} 第 ${R.meta.lv+1} 關`;
  if(R.mode === 'smart') return '📖 今日溫習';
  if(R.mode === 'monster') return '⚔️ 怪獸大戰';
  if(R.mode === 'test') return '👹 測驗挑戰';
  return `${SK[R.meta.sk].icon} 隨機練習`;
}
SCREENS.quiz = () => {
  const q = R.list[R.i];
  R.ans = false;
  let foe = '';
  if(R.mode === 'test'){ const hp = R.list.length - R.ok; foe = `<div class="foe"><span class="fe" id="foe">👹</span><div class="hp"><b>測驗大魔王</b><div class="hpbar"><i style="width:${hp/R.list.length*100}%"></i></div></div></div>`; }
  else if(S.mon[q.id]){ const m = S.mon[q.id]; foe = `<div class="foe"><span class="fe" id="foe">${m.e}</span><div class="hp"><b>錯題怪獸</b>　${'❤️'.repeat(m.hp)}<div class="small" style="opacity:.8">答對就打中佢！</div></div></div>`; }
  const tip = q.tip || (q.t === 'match' ? `把${q.kind}配對` : SK[q.sk].tip);
  return `<div class="qhead"><button class="back" data-act="quit">✖</button><div class="prog"><i style="width:${R.i/R.list.length*100}%"></i></div><div class="combo" id="combo">${R.combo >= 2 ? '🔥' + R.combo : ''}</div></div>
    <div class="small muted" style="font-weight:800;margin:-4px 0 8px">${sessionTitle()}　${R.i+1}/${R.list.length}</div>
    ${foe}<div id="qbody">${RENDER[q.t](q, tip)}</div>`;
};
AFTER.quiz = () => {
  const q = R.list[R.i];
  if(AFTER_Q[q.t]) AFTER_Q[q.t](q);
  // 第一次答題：手指指住選項（GAME-17）
  if(!S.tut.q){ const t = document.querySelector('.opts,.pool,.palette,.chs,.mgrid'); if(t){ t.style.position = 'relative'; const h = document.createElement('div'); h.className = 'hand'; h.id = 'tuthand'; h.textContent = '👆'; h.style.left = '50%'; h.style.bottom = '-50px'; h.style.marginLeft = '-22px'; t.appendChild(h); } }
};
const qSpeak = q => q.t === 'mc' ? q.q.replace(/＿＿/g, '甚麼') : q.t === 'typo' ? q.s : q.t === 'punct' ? q.s.replace(/＿/g, '') : q.h || '';
const spkBtn = q => (q.t === 'mc' || q.t === 'typo' || q.h) ? `<button class="spk" data-act="speak">🔊</button>` : '';
const fmtQ = s => esc(s).replace(/（＿＿）/g, '（<span class="blank" id="blk">？</span>）').replace(/＿＿/g, '<span class="blank" id="blk">？</span>');

const RENDER = {}, AFTER_Q = {};
RENDER.mc = (q, tip) => {
  const opts = q.fixed ? q.o.map((t, i) => ({t, i})) : shuffle(q.o.map((t, i) => ({t, i})));
  const long = q.o.some(o => o.length > 7);
  return `<div class="qcard"><div class="qtip">${esc(tip)}${spkBtn(q)}</div><div class="qtext">${q.quote ? '「' + esc(q.q) + '」' : fmtQ(q.q)}</div></div>
    <div class="opts ${long ? 'long' : q.o.length === 3 ? 'three' : ''}">${opts.map((o, k) => `<button class="opt" data-act="mc" data-i="${o.i}"><b>${'ABCD'[k]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>`;
};
RENDER.order = (q, tip) => {
  let pool = shuffle(q.w.map((t, i) => ({t, i})));
  for(let k = 0; k < 5 && pool.every((x, i) => x.i === i); k++) pool = shuffle(pool);
  const L = 'ABCDEFGH';
  if(q.para) pool.forEach((x, k) => x.lab = L[k]);
  R.ord = {pool, ans:[]};
  return `<div class="qcard"><div class="qtip">${esc(tip)}${spkBtn(q)}</div>${q.h ? `<div class="hint">${esc(q.h)}</div>` : ''}${q.para ? '<div class="small muted" style="font-weight:700">按次序撳句子</div>' : ''}</div>
    <div class="ansline ${q.para ? 'col' : ''}" id="ansline"></div>
    <div class="pool ${q.para ? 'col' : ''}" id="pool"></div>
    <button class="btn ok" id="chk" data-act="ordchk" disabled>✔ 檢查</button>`;
};
AFTER_Q.order = () => drawOrder();
function drawOrder(){
  const q = R.list[R.i], o = R.ord;
  const tl = (x, act, k) => `<button class="tl ${q.para ? 'lab' : ''}" data-act="${act}" data-k="${k}">${q.para ? `<b>${x.lab}</b>` : ''}${esc(x.t)}</button>`;
  $('#ansline').innerHTML = o.ans.map((x, k) => tl(x, 'ordback', k)).join('') + (!q.para && o.ans.length === q.w.length ? `<span class="endp">${q.end || '。'}</span>` : '') + (o.ans.length ? '' : '<span class="muted small" style="margin:auto">撳下面嘅詞語</span>');
  $('#pool').innerHTML = o.pool.map((x, k) => o.ans.includes(x) ? '' : tl(x, 'ordpick', k)).join('');
  $('#chk').disabled = o.ans.length !== q.w.length;
}
RENDER.punct = (q, tip) => {
  const parts = q.s.split('＿');
  R.pc = {v: Array(parts.length - 1).fill(''), cur: 0};
  return `<div class="qcard"><div class="qtip">${esc(tip)}</div><div class="qtext" id="ptext">${parts.map((p, k) => esc(p) + (k < parts.length - 1 ? `<button class="slot" data-act="slot" data-k="${k}"></button>` : '')).join('')}</div></div>
    <div class="palette">${['，','。','、','！','？','：','「','」','……','《','》','；'].map(p => `<button class="pal ${p.length > 1 ? 'sm' : ''}" data-act="pal" data-p="${p}">${p}</button>`).join('')}</div>
    <div class="row"><button class="btn gray" data-act="pclr">↺ 清除</button><button class="btn ok" id="chk" data-act="pchk" disabled>✔ 檢查</button></div>`;
};
AFTER_Q.punct = () => drawPunct();
function drawPunct(){
  document.querySelectorAll('.slot').forEach((b, k) => { b.textContent = R.pc.v[k]; b.classList.toggle('sel', k === R.pc.cur && !R.ans); });
  const c = $('#chk'); if(c) c.disabled = R.pc.v.some(x => !x);
}
RENDER.typo = (q, tip) => {
  const idx = q.s.indexOf(q.c), chars = Array.from(q.s); chars[idx] = q.w;
  R.ty = {idx, step:1};
  return `<div class="qcard"><div class="qtip">${esc(tip)}${spkBtn(q)}</div><div class="chs">${chars.map((c, k) => /[，。？！、：；「」]/.test(c) ? `<span class="ch pun">${c}</span>` : `<button class="ch" data-act="ch" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>
    <div id="fix"></div>`;
};
RENDER.match = (q, tip) => {
  R.mt = {L: shuffle(q.pairs.map((p, i) => ({t:p[0], i}))), Rr: shuffle(q.pairs.map((p, i) => ({t:p[1], i}))), sel:null, done:0, miss:0};
  return `<div class="qcard"><div class="qtip">${esc(tip)}</div><div class="small muted" style="font-weight:700">${q.kind === '近義詞' ? '意思差不多的詞語' : '意思相反的詞語'}：左邊撳一個，右邊撳一個</div></div>
    <div class="mgrid"><div class="mcol">${R.mt.L.map(x => `<button class="mt" data-act="mt" data-s="L" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    <div class="mcol">${R.mt.Rr.map(x => `<button class="mt" data-act="mt" data-s="R" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
};

function qAnswerText(q){
  if(q.t === 'mc') return q.o[q.a];
  if(q.t === 'order') return q.para ? q.w.join('，') + '。' : q.w.join('') + (q.end || '。');
  if(q.t === 'punct'){ const parts = q.s.split('＿'); return parts.map((p, k) => p + (k < parts.length-1 ? (Array.isArray(q.a[k]) ? q.a[k][0] : q.a[k]) : '')).join(''); }
  if(q.t === 'typo') return `「${q.w}」應該寫成「${q.c}」：${q.s}`;
  if(q.t === 'match') return q.pairs.map(p => p[0] + '－' + p[1]).join('　');
  return '';
}
function qText(q){ return q.t === 'mc' ? q.q : q.t === 'typo' || q.t === 'punct' ? q.s.replace(/＿/g, '（　）') : q.t === 'order' ? (q.h || q.w.join(' / ')) : q.pairs.map(p => p[0]).join('、'); }

function record(q, ok){
  const t = today();
  const s = S.qs[q.id] || (S.qs[q.id] = {c:0, w:0}); ok ? s.c++ : s.w++; s.last = t;
  const a = S.sk[q.sk] || (S.sk[q.sk] = []); a.push(ok ? 1 : 0); if(a.length > 30) a.shift();
  const d = S.days[t] || (S.days[t] = {n:0, c:0}); d.n++; if(ok) d.c++;
  S.total.n++; if(ok) S.total.c++;
  ensureTasks();
  if(ok){ taskAdd('correct', 1); if(q.sk === S.tasks.w) taskAdd('weak', 1); }
  const m = S.mon[q.id];
  if(ok){
    if(m && m.hit !== t){ m.hp--; m.hit = t; taskAdd('monster', 1); if(m.hp <= 0){ delete S.mon[q.id]; S.beaten.push(m.e); return {ev:'kill', e:m.e}; } return {ev:'hit', e:m.e}; }
  } else {
    if(m){ m.hp = 2; return {ev:'heal', e:m.e}; }
    const e = pickOne(MONS); S.mon[q.id] = {hp:2, e, born:t, hit:''}; return {ev:'new', e};
  }
  return {ev:''};
}

function answer(ok, srcEl){
  if(R.ans) return; R.ans = true;
  const hand = $('#tuthand'); if(hand){ hand.remove(); S.tut.q = 1; }
  const q = R.list[R.i], r = record(q, ok);
  R.results.push({id:q.id, ok});
  let gain = 0;
  if(ok){
    R.ok++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo);
    if(R.combo > S.total.maxCombo) S.total.maxCombo = R.combo;
    taskAdd('combo', R.combo, true);
    gain = 5 + (R.combo >= 3 ? 2 : 0) + (R.combo >= 5 ? 3 : 0);
    R.coins += gain; S.coins += gain; R.xp += 10;
    SFX.ok();
    const c = $('#combo'); if(c){ c.textContent = R.combo >= 2 ? '🔥' + R.combo : ''; c.classList.remove('hot'); void c.offsetWidth; c.classList.add('hot'); }
    const rect = (srcEl || $('#qbody')).getBoundingClientRect(); floatText('+' + gain + '🪙', rect.left + rect.width/2, rect.top);
    const f = $('#foe'); if(f){ f.classList.add('hitfx'); setTimeout(SFX.hit, 120); }
    if(R.mode === 'test'){ const bar = document.querySelector('.foe .hpbar i'); if(bar) bar.style.width = ((R.list.length - R.ok)/R.list.length*100) + '%'; }
  } else {
    R.combo = 0; R.xp += 2; SFX.bad();
    const c = $('#combo'); if(c) c.textContent = '';
    if(srcEl){ srcEl.classList.add('shake'); }
  }
  if(r.ev === 'hit') R.hits++; if(r.ev === 'kill') R.kills++; if(r.ev === 'new') R.newMon++;
  save();
  showFb(ok, q, r, gain);
}
const PRAISE = ['好叻！','答對了！','正呀！','完全正確！','你真棒！','犀利！','好嘢！'];
let fbT = 0;
function showFb(ok, q, r, gain){
  const fb = $('#fb'), last = R.i >= R.list.length - 1;
  const ev = r.ev === 'kill' ? `💥 打敗咗怪獸 ${r.e}！` : r.ev === 'hit' ? `💥 打中怪獸 ${r.e}！仲差一次（第日再打）` : r.ev === 'new' ? `${r.e} 一隻錯題怪獸走咗出嚟！之後打敗佢` : r.ev === 'heal' ? `${r.e} 怪獸回復咗體力！` : '';
  let expl = q.e || '';
  if(q.t === 'typo' && !expl) expl = `「${q.w}」應寫作「${q.c}」。`;
  fb.className = ok ? 'good' : 'bad';
  fb.innerHTML = `<div class="fh">${ok ? '🎉 ' + pickOne(PRAISE) + (gain ? `<span style="margin-left:auto;font-size:18px">+${gain}🪙</span>` : '') : '💡 差少少！'}</div>
    ${ok ? '' : `<div class="fa">正確答案：${esc(qAnswerText(q))}</div>`}
    ${expl && (!ok || q.t === 'mc' && q.sk === 'qtype') ? `<div class="fe">${esc(expl)}</div>` : ''}
    ${ev ? `<div class="fx">${ev}</div>` : ''}
    <button class="btn ${ok ? 'ok' : 'pur'}" data-act="next">${last ? '🏁 睇結果' : ok ? '下一題 →' : '明白了 →'}</button>`;
  requestAnimationFrame(() => fb.classList.add('show'));
  clearTimeout(fbT);
  if(ok && !(q.sk === 'qtype' && expl) && !ev) fbT = setTimeout(() => { if(fb.classList.contains('show') && cur === 'quiz') ACT.next(); }, 1400);
}
function hideFb(){ clearTimeout(fbT); $('#fb').classList.remove('show'); }

function finish(){
  const n = R.list.length, acc = R.ok / n;
  const res = {acc, stars:0, bonus:0, ups:0, evo:false, grade:'', score:0};
  if(R.mode === 'level'){
    res.stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : acc >= 0.5 ? 1 : 0;
    const k = R.meta.sk + '-' + R.meta.lv, prev = S.lv[k] || 0;
    if(res.stars > prev) S.lv[k] = res.stars;
    res.bonus = res.stars * 10;
    taskAdd('lv', 1);
  }
  if(R.mode === 'test'){
    res.score = Math.round(acc * 100);
    res.grade = gradeOf(res.score);
    S.tests.push({d:today(), s:res.score, n, c:R.ok});
    res.bonus = Math.round(res.score / 5);
  }
  if(R.mode === 'smart' || R.mode === 'rand' || R.mode === 'monster') res.bonus = acc >= 0.8 ? 10 : 5;
  S.coins += res.bonus; R.coins += res.bonus;
  const st0 = stageOf(S.pet.lv);
  S.pet.xp += R.xp;
  while(S.pet.xp >= need(S.pet.lv)){ S.pet.xp -= need(S.pet.lv); S.pet.lv++; res.ups++; }
  res.evo = stageOf(S.pet.lv) !== st0;
  save(); R.res = res;
  show('result');
  checkAch();
}
const gradeOf = s => s >= 93 ? '甲＋' : s >= 85 ? '甲' : s >= 78 ? '甲－' : s >= 70 ? '乙＋' : s >= 62 ? '乙' : s >= 55 ? '乙－' : '丙';

      <div class="stat"><span>經驗值</span><b>+${R.xp}</b></div>
      ${R.kills ? `<div class="stat"><span>打敗怪獸</span><b>💥 ${R.kills}</b></div>` : ''}
      ${R.newMon ? `<div class="stat"><span>新怪獸</span><b>👾 ${R.newMon}</b></div>` : ''}
    </div>
    <div class="stage bg-${S.bg}"><div class="petwrap">
      ${r.evo ? `<div class="evo">✨ ${esc(p.name)} 進化咗！變成${STAGE_NAME[stageOf(p.lv)]}！✨</div>` : r.ups ? `<div class="evo">⬆️ 升級！Lv${p.lv}</div>` : ''}
      ${petHTML(120, r.evo || r.ups ? 'bounce' : '')}
      <div class="pname">${esc(p.name)} <span class="lvtag">Lv${p.lv}</span></div>

/* ========== 揀題 ========== */
function weightedPick(n, opts){
  opts = opts || {};
  const w = weakest(), t = today(), out = [], used = new Set();
  // 先放可以打嘅怪獸（最多 3 隻）
  if(!opts.noMon) shuffle(monReady()).slice(0, 3).forEach(id => { out.push(QMAP[id]); used.add(id); });
  const pool = QS.filter(q => !used.has(q.id) && (!opts.noMatch || q.t !== 'match'));
  const score = q => {
    const s = S.qs[q.id], acc = recentAcc(q.sk);
    let x = 1 + (acc === null ? 0.5 : (1 - acc) * 3);
    if(q.sk === w) x += 2;
    if(!s) x += 1.2; else { x += s.w * 1.5 - s.c * 0.3; if(s.last === t) x *= 0.3; }
    if(q.t === 'match') x *= 0.5;
    return Math.max(0.1, x);
  };
  const cand = pool.map(q => ({q, w:score(q)}));
  while(out.length < n && cand.length){
    const tot = cand.reduce((a, c) => a + c.w, 0); let r = Math.random() * tot, k = 0;
    while(k < cand.length - 1 && (r -= cand[k].w) > 0) k++;
    out.push(cand[k].q); cand.splice(k, 1);
  }
  return shuffle(out);
}

const ACT = {

  pet(b){ SFX.tap(); const p = b.closest('.pet'); p.classList.remove('bounce'); void p.offsetWidth; p.classList.add('bounce'); const bub = $('#bub'); if(bub) bub.textContent = petLine(); },
  pickpet(b){ SFX.tap(); curPick.name = $('#nm').value; curPick.sp = b.dataset.k; curPick.pn = ''; show('welcome'); },
  start(){
    if(!curPick.sp) return;

  },
  isle(b){ SFX.tap(); show('isle', b.dataset.sk); },
  locked(){ SFX.bad(); toast('🔒 先過咗上一關'); },
  level(b){ SFX.tap(); const sk = b.dataset.sk, i = +b.dataset.i; startSession('level', shuffle(levelsOf(sk)[i]), {sk, lv:i}); },
  randisle(b){ SFX.tap(); const sk = b.dataset.sk; startSession('rand', shuffle(skillQs(sk)).slice(0, sk === 'match' ? 3 : 8), {sk}); },
  smart(){ SFX.tap(); startSession('smart', weightedPick(10)); },
  test(){ SFX.tap(); startSession('test', weightedPick(15, {noMon:true, noMatch:true})); },
  fight(){ SFX.tap(); startSession('monster', shuffle(monReady()).slice(0, 8).map(id => QMAP[id])); },
  quit(){ if(confirm('要離開嗎？今次嘅進度唔會計星星。')){ hideFb(); show('home'); } },
  speak(){ speak(qSpeak(R.list[R.i])); },
  next(){ hideFb(); if(!R) return; R.i++; if(R.i >= R.list.length) finish(); else show('quiz'); },
  mc(b){
    if(R.ans) return;
    const q = R.list[R.i], i = +b.dataset.i, ok = i === q.a;
    document.querySelectorAll('.opt').forEach(o => { const k = +o.dataset.i; if(k === q.a) o.classList.add('right'); else if(o === b) o.classList.add('wrong'); else o.classList.add('dim'); });
    const blk = $('#blk'); if(blk){ blk.textContent = q.o[q.a]; blk.classList.add(ok ? 'fill-ok' : 'fill-bad'); }
    answer(ok, b);
  },
  ordpick(b){ if(R.ans) return; SFX.tap(); R.ord.ans.push(R.ord.pool[+b.dataset.k]); drawOrder(); },
  ordback(b){ if(R.ans) return; SFX.tap(); R.ord.ans.splice(+b.dataset.k, 1); drawOrder(); },
  ordchk(b){
    if(R.ans) return;
    const q = R.list[R.i], o = R.ord;
    const ok = q.para ? o.ans.every((x, k) => x.i === k) : (o.ans.map(x => x.t).join('') === q.w.join('') || (q.alt || []).includes(o.ans.map(x => x.t).join('')));
    $('#ansline').style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
    answer(ok, $('#ansline'));
  },
  slot(b){ if(R.ans) return; SFX.tap(); R.pc.cur = +b.dataset.k; drawPunct(); },
  pal(b){
    if(R.ans) return; SFX.tap();
    const v = R.pc.v; v[R.pc.cur] = b.dataset.p;
    let nx = -1; for(let k = 1; k <= v.length; k++){ const j = (R.pc.cur + k) % v.length; if(!v[j]){ nx = j; break; } }
    if(nx >= 0) R.pc.cur = nx;
    drawPunct();
  },
  pclr(){ if(R.ans) return; R.pc.v = R.pc.v.map(() => ''); R.pc.cur = 0; drawPunct(); },
  pchk(){
    if(R.ans) return;
    const q = R.list[R.i]; let ok = true;
    document.querySelectorAll('.slot').forEach((s, k) => { const acc = Array.isArray(q.a[k]) ? q.a[k] : [q.a[k]]; const g = acc.includes(R.pc.v[k]); if(!g){ ok = false; s.textContent = acc[0]; } s.classList.remove('sel'); s.classList.add(g ? 'okk' : 'bad'); });
    answer(ok, $('#ptext'));
  },
  ch(b){
    if(R.ans || R.ty.step !== 1) return;

    if(k === R.ty.idx){
      SFX.tap(); R.ty.step = 2; b.classList.add('found');
      $('#fix').innerHTML = `<div class="qtip" style="justify-content:center">「${esc(q.w)}」應該寫成邊個字？</div><div class="opts">${shuffle([q.c, q.w, q.d]).map((c, i) => `<button class="opt" data-act="typofix" data-c="${esc(c)}" style="justify-content:center;font-size:30px"><b>${'ABC'[i]}</b>${esc(c)}</button>`).join('')}</div>`;
    } else {
      b.classList.add('miss'); const r = document.querySelector(`.ch[data-k="${R.ty.idx}"]`); if(r){ r.classList.add('okk'); r.textContent = q.c; }

  typofix(b){
    if(R.ans) return;
    const q = R.list[R.i], ok = b.dataset.c === q.c;
    document.querySelectorAll('#fix .opt').forEach(o => o.classList.add(o.dataset.c === q.c ? 'right' : o === b ? 'wrong' : 'dim'));

    else { m.miss++; b.classList.add('shake'); m.sel.el.classList.add('shake'); const a = m.sel.el; setTimeout(() => { b.classList.remove('shake'); a.classList.remove('shake'); }, 450); SFX.bad(); m.sel.el.classList.remove('sel'); }
    m.sel = null;
    if(m.done === R.list[R.i].pairs.length) setTimeout(() => answer(m.miss <= 1), 300);

    const t = S.tasks.list[+b.dataset.i]; if(!t || t.got || t.p < t.goal) return;

  stab(b){ SFX.tap(); shopTab = b.dataset.k; show('shop'); },
  item(b){

      if(!confirm(`用 ${it.p} 個金幣買「${it.n}」？`)) return;

  addq(){
    const q = $('#cq').value.trim(), o = [0,1,2,3].map(i => $('#co'+i).value.trim()), a = +$('#ca').value, e = $('#ce').value.trim();

/* ========== 自動更新（WEB-07） ========== */
let pendingVer = '', lastFront = Date.now(), lastTouch = 0;
window.addEventListener('pointerdown', () => lastTouch = Date.now(), true);
async function checkUpdate(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch(location.pathname + '?vcheck=' + Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const m = (await r.text()).match(new RegExp("__SR" + "_VER='([0-9A-Za-z.-]+)'"));
    if(m && m[1] !== VER){ pendingVer = m[1]; tryReload(); }
  }catch(e){}
}
function tryReload(){
  if(!pendingVer || cur !== 'home' || Date.now() - lastTouch < 4000) return;
  try{ const k = 'sr_reload_' + pendingVer, t = +sessionStorage.getItem(k) || 0; if(Date.now() - t < 120000) return; sessionStorage.setItem(k, Date.now()); }catch(e){}
  save(true); location.replace(location.pathname + '?v=' + pendingVer);
}
function onFront(){
  fixH(); lastFront = Date.now();
  if(cur === 'home') show('home');   // WEB-21：日子可能變咗，重新計「今日」
  checkUpdate();
}

/* ========== 開始 ========== */
if(!S.pet.sp) show('welcome'); else show('home');
checkUpdate();
